plugins {
    id 'java'
    id 'com.github.spotbugs' version '6.5.1' apply false
    id 'io.spring.dependency-management' version '1.1.0' apply false
    id 'name.remal.sonarlint' version '7.0.1' apply false
    id 'org.springframework.boot' version '3.4.4' apply false
}

def mainQualityTasks = ['checkstyleMain', 'pmdMain', 'spotbugsMain', 'sonarlintMain']
def testQualityTasks = ['checkstyleTest', 'pmdTest', 'spotbugsTest', 'sonarlintTest']
def allQualityTasks = (mainQualityTasks + testQualityTasks).toSet()

def matchingQualityTasks = { taskNames ->
    subprojects.collect { subproject ->
        subproject.tasks.matching { task ->
            taskNames.any { taskName -> task.name.equalsIgnoreCase(taskName) }
        }
    }
}

tasks.register('qualityMain') {
    group = 'verification'
    description = 'Runs local static analysis for production source sets in all modules.'
    dependsOn matchingQualityTasks(mainQualityTasks)
}

tasks.register('qualityTest') {
    group = 'verification'
    description = 'Runs local static analysis for test source sets in all modules.'
    dependsOn matchingQualityTasks(testQualityTasks)
}

tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Runs all local static analysis tasks across all modules.'
    dependsOn tasks.named('qualityMain'), tasks.named('qualityTest')
}

tasks.register('doxygen', Exec) {
    group = 'documentation'
    description = 'Generates API documentation with Doxygen for all modules.'

    def doxyfile = layout.projectDirectory.file('config/doxygen/Doxyfile').asFile
    def documentedSources = [
        'README.md',
        'commons/src/main/java',
        'server/src/main/java',
        'client/src/main/java',
        'web-client/src/main/java'
    ]

    inputs.file(doxyfile)
    inputs.files(documentedSources.collect { path -> file(path) })
    outputs.dir(layout.buildDirectory.dir('reports/doxygen'))

    workingDir = projectDir
    commandLine 'doxygen', doxyfile.absolutePath

    doFirst {
        if (!doxyfile.exists()) {
            throw new RuntimeException("Doxygen config file not found: ${doxyfile}")
        }
    }
}

tasks.register('sphinx', Exec) {
    group = 'documentation'
    description = 'Generates the user manual with Sphinx (activate the .sphinx virtualenv before running).'

    def sphinxSource = layout.projectDirectory.dir('docs').asFile
    def sphinxOutput = layout.buildDirectory.dir('reports/sphinx/html').get().asFile

    inputs.dir(sphinxSource)
    outputs.dir(sphinxOutput)

    workingDir = projectDir

    def venvSphinx = layout.projectDirectory.file('.sphinx/bin/sphinx-build').asFile
    commandLine(venvSphinx.exists() ? venvSphinx.absolutePath : 'sphinx-build',
                '-b', 'html', '-q',
                sphinxSource.absolutePath, sphinxOutput.absolutePath)

    doFirst {
        sphinxOutput.mkdirs()
    }
}

tasks.register('docs') {
    group = 'documentation'
    description = 'Builds all project documentation artifacts (Doxygen + Sphinx).'
    dependsOn tasks.named('doxygen'), tasks.named('sphinx')
}

allprojects {
    group = 'es.deusto.spq'
    version = '0.0.1-SNAPSHOT'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    apply plugin: 'name.remal.sonarlint'
    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    tasks.withType(Test) {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }

    // Default 'test' task runs only unit tests (no integration or performance tags)
    tasks.named('test', Test) {
        useJUnitPlatform {
            excludeTags 'integration', 'performance'
        }
    }

    jacoco {
        toolVersion = '0.8.10'
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        maxWarnings = 0
        ignoreFailures = false
        showViolations = true
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    pmd {
        consoleOutput = true
        incrementalAnalysis = true
        ruleSets = []
        ruleSetFiles = files(rootProject.file('config/pmd/ruleset.xml'))
    }

    tasks.withType(Pmd).configureEach {
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotbugs {
        effort = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('DEFAULT')
        ignoreFailures = false
        showProgress = true
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html.required = true
            xml.required = true
        }
    }

    sonarLint {
        languages {
            include('java', 'xml')
        }
        logging {
            withDescription = false
        }
    }

    tasks.named('check').configure {
        setDependsOn(
            dependsOn
                - tasks.withType(Checkstyle)
                - tasks.withType(Pmd)
                - tasks.withType(com.github.spotbugs.snom.SpotBugsTask)
                - tasks.matching { task -> task.name.toLowerCase().startsWith('sonarlint') }
        )
    }

    def explicitlyRequestedTasks = providers.provider {
        gradle.startParameter.taskNames.collect { taskName ->
            def normalized = taskName.tokenize(':').last()
            normalized ?: taskName
        }.toSet()
    }

    def shouldRunQualityTask = { task ->
        def requestedTasks = explicitlyRequestedTasks.get()
        requestedTasks.contains(task.name) ||
            requestedTasks.any { requested ->
                ['qualityMain', 'qualityTest', 'qualityCheck'].contains(requested)
            }
    }

    tasks.withType(Checkstyle).configureEach {
        onlyIf { shouldRunQualityTask(it) }
    }

    tasks.withType(Pmd).configureEach {
        onlyIf { shouldRunQualityTask(it) }
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        onlyIf { shouldRunQualityTask(it) }
    }

    tasks.matching { task -> allQualityTasks.contains(task.name) && task.name.toLowerCase().startsWith('sonarlint') }
        .configureEach {
            onlyIf { shouldRunQualityTask(it) }
        }

    if (tasks.findByName('jacocoTestReport') == null) {
        tasks.register('jacocoTestReport', JacocoReport) {
            dependsOn(tasks.named('test'))

            reports {
                xml.required = true
                csv.required = false
                html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
            }

            classDirectories.setFrom(layout.buildDirectory.dir('classes/java/main').map { d ->
                fileTree(d) { exclude '**/generated/**' }
            })

            sourceDirectories.setFrom(files('src/main/java'))
            executionData.setFrom(layout.buildDirectory.dir('jacoco').map { d ->
                fileTree(d) { include '*.exec' }
            })
        }
    } else {
        tasks.named('jacocoTestReport', JacocoReport).configure {
            dependsOn(tasks.named('test'))
            reports {
                xml.required = true
                csv.required = false
                html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
            }
            classDirectories.setFrom(layout.buildDirectory.dir('classes/java/main').map { d ->
                fileTree(d) { exclude '**/generated/**' }
            })
            sourceDirectories.setFrom(files('src/main/java'))
            executionData.setFrom(layout.buildDirectory.dir('jacoco').map { d ->
                fileTree(d) { include '*.exec' }
            })
        }
    }
}
