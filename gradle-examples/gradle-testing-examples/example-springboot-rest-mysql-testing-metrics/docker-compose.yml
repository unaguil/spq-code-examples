services:

  mysql:
    image: mysql:8
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/create-messages.sql:/docker-entrypoint-initdb.d/01-create-messages.sql:ro
    environment:
      MYSQL_DATABASE: messages
      MYSQL_USER: spq
      MYSQL_PASSWORD: spq
      MYSQL_ROOT_PASSWORD: rootpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uspq", "-pspq"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: spq
      DB_PASS: spq
      SPRING_JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web-client:
    build:
      context: .
      dockerfile: web-client/Dockerfile
    environment:
      SERVER_API_BASE_URL: http://server:8080
    ports:
      - "8081:8081"
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - server
      - web-client
      - grafana

volumes:
  mysql_data:
