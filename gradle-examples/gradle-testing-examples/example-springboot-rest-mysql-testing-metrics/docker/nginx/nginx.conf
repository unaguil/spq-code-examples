events {}

http {
    upstream server_upstream {
        server server:8080;
    }

    upstream webclient_upstream {
        server web-client:8081;
    }

    upstream grafana_upstream {
        server grafana:3000;
    }

    server {
        listen 80;

        # /api/ -> server REST API (strip /api prefix)
        location /api/ {
            proxy_pass http://server_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /grafana/ -> grafana (keep /grafana prefix; Grafana handles sub-path via GF_SERVER_ROOT_URL)
        location /grafana/ {
            proxy_pass http://grafana_upstream/grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # / -> web-client (catch-all, must come last)
        location / {
            proxy_pass http://webclient_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
